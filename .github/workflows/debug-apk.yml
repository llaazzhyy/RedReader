name: Debug APK

# Fast build that only produces an installable debug APK (no lint/PMD/tests).
# Download it from the "Artifacts" section of the finished run.

on:
    workflow_dispatch:
    push:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Java 21
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 21

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v3

            -   name: Install NDK
                run: |
                    SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                    NDK_VERSION="$(yq .versions.ndk gradle/libs.versions.toml)"
                    echo "Installing NDK ${NDK_VERSION}"
                    echo "y" | "$SDKMANAGER" "ndk;$NDK_VERSION" --sdk_root="${ANDROID_SDK_ROOT}"

            # A fixed (public, debug-only) signing key means every build can be installed
            # over the previous one without uninstalling first.
            -   name: Use stable debug keystore
                run: |
                    mkdir -p ~/.android
                    cp .github/ci/debug.keystore ~/.android/debug.keystore

            -   name: Build debug APK
                run: ./gradlew assembleDebug

            -   name: Upload APK
                uses: actions/upload-artifact@v4
                with:
                    name: RedReader-modern-debug-apk
                    path: build/outputs/apk/debug/*.apk
